syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.proto";
option java_outer_classname = "ReceiptParsingEventProto";

message ReceiptParsingEvent {
    string event_id   = 1;
    string session_id = 2;
    string image_url  = 3;
    string status     = 4;
    int64  created_at = 5;
}